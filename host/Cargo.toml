[package]
name = "mightymonitor-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "mm-host"
path = "src/main.rs"

[dependencies]
mightymonitor-core = { path = "../core" }
tokio.workspace = true
async-trait = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
host-linux = { path = "../host-linux" }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
codec-gst = { path = "../codec-gst" }

[dev-dependencies]
socket2 = "0.6"
mightymonitor-viewer = { path = "../viewer", default-features = false }
