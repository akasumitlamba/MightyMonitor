[package]
name = "mightymonitor-virtual-display-driver"
version = "0.1.0"
edition = "2021"
license = "MIT"
[lib]
name = "MightyMonitorDisplay"
crate-type = ["cdylib"]
[dependencies]
thiserror = "2.0.3"
anyhow = "1.0.93"
wdf-umdf-sys = { path = "../vendor/wdf-umdf-sys" }
wdf-umdf = { path = "../vendor/wdf-umdf" }
log = "0.4.22"
bytemuck = { version = "1.19.0", features = ["derive"] }
mm-display-driver-protocol = { path = "../protocol" }
tokio = { version = "1.42.0", features = ["macros", "net", "rt-multi-thread", "io-util", "sync", "time"] }
[dependencies.windows]
version = "0.58.0"
features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi"]
[build-dependencies]
winresource = "0.1.19"
