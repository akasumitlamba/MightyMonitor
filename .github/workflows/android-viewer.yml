name: Build and test Android viewer
on:
  workflow_dispatch:
  push:
    # Interop uses the headless viewer; desktop GUI changes have separate platform checks.
    branches: ['codex/android-viewer', 'codex/android-sharing-light-ui', 'codex/secure-pairing', 'codex/wayland-sharing', 'codex/remote-control', 'codex/device-discovery']
    paths: ['scripts/android/**', 'scripts/check-android-alignment.py', 'scripts/artifact-manifest.py', 'discovery/**', 'security/**', 'viewer/src/lib.rs', 'viewer/src/net.rs', 'viewer/src/render.rs', 'viewer/Cargo.toml', 'android/app/**', 'android/*.gradle', 'android/gradle.properties', 'android-bridge/**', 'core/**', 'host/**', 'host-linux/**', 'codec-gst/**', 'viewer/examples/receive_smoke.rs', 'Cargo.toml', 'Cargo.lock', '.github/workflows/android-viewer.yml']
  pull_request:
    paths: ['scripts/android/**', 'scripts/check-android-alignment.py', 'scripts/artifact-manifest.py', 'discovery/**', 'security/**', 'core/**', 'host/**', 'host-linux/**', 'codec-gst/**', 'Cargo.toml', 'Cargo.lock', 'viewer/src/lib.rs', 'viewer/src/net.rs', 'viewer/src/render.rs', 'viewer/Cargo.toml', 'viewer/examples/receive_smoke.rs', 'android/app/**', 'android/*.gradle', 'android/gradle.properties', 'android-bridge/**', '.github/workflows/android-viewer.yml']
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p android-bridge --features jni --locked
      - run: cargo clippy -p android-bridge --features jni --all-targets --locked -- -D warnings
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build the shared Rust protocol library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 26 -o android/app/src/main/jniLibs build --release -p android-bridge --features jni --locked
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug assembleDebugAndroidTest
      - name: Verify actual native and debug APK 16 KiB alignment
        run: |
          python3 scripts/check-android-alignment.py android/app/src/main/jniLibs/*/*.so
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 android/app/build/outputs/apk/debug/app-debug.apk
      - name: Refuse an unsigned production build
        shell: bash
        run: |
          unset MM_ANDROID_KEYSTORE MM_ANDROID_STORE_PASSWORD MM_ANDROID_KEY_ALIAS MM_ANDROID_KEY_PASSWORD
          if gradle -p android assembleRelease > /tmp/mm-unsigned-release.log 2>&1; then
            echo 'Release unexpectedly built without a private signing key'
            exit 1
          fi
          grep -F 'Release signing requires a private keystore' /tmp/mm-unsigned-release.log
      - name: Verify release signing with a disposable test key
        shell: bash
        run: |
          umask 077
          export MM_ANDROID_KEYSTORE="$RUNNER_TEMP/mm-disposable-signing.jks"
          export MM_ANDROID_STORE_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_hex(24))')
          export MM_ANDROID_KEY_PASSWORD="$MM_ANDROID_STORE_PASSWORD"
          export MM_ANDROID_KEY_ALIAS=disposable-ci
          trap 'rm -f "$MM_ANDROID_KEYSTORE"' EXIT
          keytool -genkeypair -keystore "$MM_ANDROID_KEYSTORE" -storepass:env MM_ANDROID_STORE_PASSWORD -keypass:env MM_ANDROID_KEY_PASSWORD -alias "$MM_ANDROID_KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 2 -dname 'CN=MightyMonitor disposable CI test' > /tmp/mm-test-key.log 2>&1
          gradle -p android assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          rm -f android/app/build/outputs/apk/release/app-release.apk
      - name: Record APK checksums and source revision
        run: python3 scripts/artifact-manifest.py --output android/app/build/outputs/apk android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-viewer-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            android/app/build/outputs/apk/SHA256SUMS
            android/app/build/outputs/apk/BUILD_INFO.json
          if-no-files-found: error
  emulator:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [29, 30, 34, 36]
    needs: apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-viewer-apks
          path: /tmp/mightymonitor-apks
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Preinstall the test platform with bounded download retries
        run: |
          for attempt in 1 2 3; do
            if timeout 120s sdkmanager "platforms;android-${{ matrix.api }}" > /tmp/mm-android-sdk-install.log 2>&1; then exit 0; fi
            sleep 2
          done
          cat /tmp/mm-android-sdk-install.log
          exit 1
      - name: Install real desktop video dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libpipewire-0.3-dev libspa-0.2-dev clang libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p mightymonitor-host
      - run: cargo build --release --locked -p mightymonitor-viewer --example receive_smoke --no-default-features
      - name: Start isolated test desktop and real H.264 host
        run: |
          Xvfb :99 -screen 0 640x480x24 > /tmp/mm-xvfb.log 2>&1 &
          for i in $(seq 1 50); do test -S /tmp/.X11-unix/X99 && break; sleep .1; done
          umask 077
          DISPLAY=:99 ./target/release/mm-host --secure --bind 127.0.0.1:5000 --fps 10 > /tmp/mm-pc-invitation-private 2> /tmp/mm-host.log &
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb install $(find /tmp/mightymonitor-apks -name app-debug.apk)
            adb install $(find /tmp/mightymonitor-apks -name app-debug-androidTest.apk)
            # Isolated emulator acceptance: preauthorize only our test service/IME.
            # The shipped app never writes these settings and always requires the user's system grant.
            # Grant accessibility inside instrumentation after its process restart.
            # Prebinding here makes Android 10/11 mark the service crashed.
            adb logcat -d > /tmp/mm-ime-install-logcat.log
            for i in $(seq 1 60); do adb shell ime list -a -s | grep -F RemoteKeyboardService && break; sleep 1; done
            adb shell dumpsys input_method > /tmp/mm-input-methods.log
            component=$(adb shell ime list -a -s | tr -d '\r' | grep -F RemoteKeyboardService | head -n 1); test -n "$component" && adb shell ime enable "$component" && adb shell ime set "$component"
            adb forward tcp:5001 tcp:5000
            adb shell run-as com.mightymonitor.app mkdir -p files
            sed -n 's|^MM_INVITE mightymonitor://127.0.0.1:5000/|mightymonitor://10.0.2.2:5000/|p' /tmp/mm-pc-invitation-private | adb shell run-as com.mightymonitor.app tee files/pc-invitation > /dev/null
            (umask 077; for i in $(seq 1 900); do adb exec-out run-as com.mightymonitor.app cat files/share-invitation > /tmp/mm-phone-invitation-private 2>/dev/null; grep -q '^mightymonitor://' /tmp/mm-phone-invitation-private && break; sleep .2; done; ./target/release/examples/receive_smoke --invitation-file /tmp/mm-phone-invitation-private --via 127.0.0.1:5001 && adb shell run-as com.mightymonitor.app touch files/desktop-video-ok) > /tmp/mm-desktop-video.log 2>&1 &
            adb shell am instrument -e desktopInterop true -e remoteControlTest true -w com.mightymonitor.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/mm-android-test.log
            adb logcat -d > /tmp/mm-android-logcat.log
            adb exec-out run-as com.mightymonitor.app tar -C files -cf - screenshots > /tmp/mm-screenshots.tar
            mkdir -p /tmp/mm-screenshots
            tar -xf /tmp/mm-screenshots.tar -C /tmp/mm-screenshots
            bash scripts/android/repeat-control-checks.sh "${{ matrix.api }}"
            grep -q 'OK (4 tests)' /tmp/mm-android-test.log
      - name: Collect logs
        if: always()
        run: test -f /tmp/mm-android-logcat.log || timeout 15s adb logcat -d > /tmp/mm-android-logcat.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-viewer-test-logs-api-${{ matrix.api }}
          path: |
            /tmp/mm-desktop-video.log
            /tmp/mm-host.log
            /tmp/mm-xvfb.log
            /tmp/mm-android-test.log
            /tmp/mm-control-repeat-*.log
            /tmp/mm-android-repeat-logcat.log
            /tmp/mm-android-logcat.log
            /tmp/mm-ime-install-logcat.log
            /tmp/mm-input-methods.log
            /tmp/mm-android-sdk-install.log
            /tmp/mm-screenshots
